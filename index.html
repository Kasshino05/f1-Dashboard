<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Dashboard</title>

    <!-- F1-style font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">

    <!-- Our own styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>F1 <span>Dashboard</span></h1>

<!-- Countdown to the next race -->
<div class="countdown-card">
    <div>
        <div class="next-label">Next Race</div>
        <div class="next-race" id="next-name">Loading...</div>
        <div class="next-place" id="next-place"></div>
    </div>

    <div class="timer">
        <div class="unit"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
        <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hrs</div></div>
        <div class="unit"><div class="num" id="mins">00</div><div class="lbl">Min</div></div>
        <div class="unit"><div class="num" id="secs">00</div><div class="lbl">Sec</div></div>
    </div>
</div>

<!-- The three cards -->
<div class="grid">
    <div class="card">
        <h2>Driver Standings</h2>
        <div id="drivers">Loading...</div>
    </div>

    <div class="card">
        <h2>Constructor Standings</h2>
        <div id="teams">Loading...</div>
    </div>

    <div class="card">
        <h2 id="race-title">Last Race</h2>
        <div class="race-place" id="race-place"></div>
        <div id="race">Loading...</div>
    </div>
</div>

<!-- JavaScript (at the bottom, so the HTML above exists when it runs) -->
<script src="index.js"></script>

</body>
</html>
